<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academic System Environment</title>
<style>
:root{--bg:#0b1020;--panel:#121a2b;--panel2:#0e1626;--line:#26334b;--text:#e8edf7;--muted:#8d9ab1;--accent:#4f8cff;--good:#36d399;--warn:#f5c451;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif;height:100vh;overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;height:100vh}.side{width:260px;background:#080d18;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#4f8cff,#735cff);display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand small{color:#6ea0ff;letter-spacing:2px}.nav{padding:14px 10px;overflow:auto;flex:1}.group{margin:15px 10px 7px;color:#5f6e87;font-size:10px;font-weight:800;letter-spacing:1.5px}.nav button{width:100%;border:0;background:transparent;color:#91a0b8;padding:9px 11px;border-radius:8px;text-align:left;margin:2px 0;display:flex;gap:11px;align-items:center}.nav button:hover{background:#111b2d;color:white}.nav button.active{background:#1c55b8;color:white}.ico{width:18px;text-align:center}.user{border-top:1px solid var(--line);padding:14px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#26344f;display:grid;place-items:center}.online{color:var(--good);font-size:11px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top h2{margin:0;font-size:16px}.status{display:flex;align-items:center;gap:8px;color:var(--muted)}.dot{width:7px;height:7px;background:var(--good);border-radius:50%;box-shadow:0 0 12px #36d399}.content{padding:26px;overflow:auto;flex:1}.view{display:none}.view.active{display:block}.title{margin-bottom:22px}.title h1{font-size:26px;margin:0 0 5px}.title p{margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:30px;margin-top:7px}.accent{border-left:3px solid var(--accent)}.warn{border-left:3px solid var(--warn)}.bad{border-left:3px solid var(--bad)}.good{border-left:3px solid var(--good)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionhead h3{margin:0;font-size:15px}.btn{border:1px solid var(--line);background:#182238;color:white;padding:9px 13px;border-radius:8px}.btn.primary{background:#2d6cdf;border-color:#3979e9}.btn.danger{background:#421a23;border-color:#6b2a38;color:#ff9ca8}.btn:hover{filter:brightness(1.12)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 11px;border-bottom:1px solid #202c42;text-align:left}.table th{font-size:11px;color:#65748d;text-transform:uppercase}.table td{color:#bac5d7}.table tr:hover{background:#101b2e}.mono{font-family:Consolas,monospace}.pill{padding:4px 8px;border-radius:999px;font-size:11px;background:#172238}.pill.good{color:var(--good);border:0}.pill.warn{color:var(--warn);border:0}.pill.bad{color:var(--bad);border:0}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px}.input{background:#0a1220;border:1px solid var(--line);color:white;border-radius:8px;padding:10px 11px;outline:none}.input:focus{border-color:#4f8cff}.grow{flex:1}.muted{color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.profileHead{display:flex;justify-content:space-between;align-items:center}.identity{display:flex;gap:15px;align-items:center}.bigavatar{width:60px;height:60px;border-radius:16px;background:#173b78;display:grid;place-items:center;font-size:21px;font-weight:800}.statline{display:flex;gap:28px}.statline b{display:block;font-size:22px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{background:transparent;border:0;color:var(--muted);padding:10px}.tabs button.active{color:white;border-bottom:2px solid var(--accent)}.code-layout{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 145px);gap:14px}.tree,.code{background:#090f1b;border:1px solid var(--line);border-radius:10px;overflow:auto}.tree{padding:12px}.tree button{background:none;border:0;color:#9eabc0;padding:6px;width:100%;text-align:left;border-radius:5px}.tree button:hover{background:#152039;color:white}.code pre{margin:0;padding:18px;white-space:pre-wrap;color:#c6d0df;font:13px Consolas,monospace}.trace{background:#070b12;border:1px solid var(--line);border-radius:10px;padding:14px;height:360px;overflow:auto;font:12px Consolas,monospace}.trace div{margin:5px 0}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20}.modal.show{display:grid}.dialog{width:520px;max-width:92vw;background:#111a2b;border:1px solid var(--line);border-radius:14px;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}.formgrid label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.bar{height:9px;background:#202c42;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#4f8cff}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #202c42}.toast{position:fixed;right:22px;bottom:22px;width:380px;background:#101a2b;border:1px solid var(--line);border-radius:12px;padding:14px;display:none;z-index:30;box-shadow:0 18px 50px #0008}.toast.show{display:block}.toast b{display:block;margin-bottom:8px}.toast .ok{color:var(--good)}@media(max-width:1000px){.side{width:210px}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><div class="logo">A</div><div><b>ACADEMIC</b><small>SYSTEM ENVIRONMENT</small></div></div>
<nav class="nav">
<div class="group">WORKSPACE</div><button data-view="overview" class="active"><span class="ico">⌂</span>Overview</button>
<div class="group">STUDENT MANAGEMENT</div>
<button data-view="students"><span class="ico">♙</span>Students</button><button data-view="classes"><span class="ico">▦</span>Classes</button><button data-view="subjects"><span class="ico">▤</span>Subjects</button><button data-view="attendance"><span class="ico">✓</span>Attendance</button><button data-view="marks"><span class="ico">★</span>Marks & GPA</button><button data-view="search"><span class="ico">⌕</span>Search</button>
<div class="group">INTELLIGENCE</div><button data-view="analytics"><span class="ico">◫</span>Analytics</button><button data-view="risk"><span class="ico">!</span>Risk Analysis</button><button data-view="alerts"><span class="ico">◉</span>Alerts</button>
<div class="group">SYSTEM</div><button data-view="database"><span class="ico">▣</span>Live Database</button><button data-view="events"><span class="ico">≋</span>Event Stream</button><button data-view="audit"><span class="ico">☷</span>Audit Log</button><button data-view="runtime"><span class="ico">⚙</span>Runtime</button><button data-view="health"><span class="ico">♥</span>Health</button>
<div class="group">DEVELOPMENT</div><button data-view="codespace"><span class="ico">⌘</span>Live Codespace</button><button data-view="ai"><span class="ico">✦</span>AI Development</button><button data-view="files"><span class="ico">□</span>Files & Artifacts</button><button data-view="settings"><span class="ico">⚙</span>Settings</button>
</nav>
<div class="user"><div class="avatar">A</div><div><b>Admin User</b><div class="online">● Connected</div></div></div>
</aside>
<main class="main"><header class="top"><h2 id="pageTitle">Overview</h2><div class="status"><span class="dot"></span> System Operational <span id="clock" class="muted mono"></span></div></header>
<section class="content">

<div id="view-overview" class="view active"></div>
<div id="view-students" class="view"></div>
<div id="view-profile" class="view"></div>
<div id="view-classes" class="view"></div><div id="view-subjects" class="view"></div>
<div id="view-attendance" class="view"></div><div id="view-marks" class="view"></div><div id="view-search" class="view"></div>
<div id="view-analytics" class="view"></div><div id="view-risk" class="view"></div><div id="view-alerts" class="view"></div>
<div id="view-database" class="view"></div><div id="view-events" class="view"></div><div id="view-audit" class="view"></div><div id="view-runtime" class="view"></div><div id="view-health" class="view"></div>
<div id="view-codespace" class="view"></div><div id="view-ai" class="view"></div><div id="view-files" class="view"></div><div id="view-settings" class="view"></div>

</section></main></div>
<div id="modal" class="modal"><div class="dialog" id="dialog"></div></div><div id="toast" class="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={view:'overview',students:[],selected:null,files:[]};
const titles={overview:'Overview',students:'Students',profile:'Student Profile',classes:'Classes',subjects:'Subjects',attendance:'Attendance',marks:'Marks & GPA',search:'Search',analytics:'Analytics',risk:'Risk Analysis',alerts:'Alerts',database:'Live Database',events:'Event Stream',audit:'Audit Log',runtime:'Runtime',health:'System Health',codespace:'Live Codespace',ai:'AI Development',files:'Files & Artifacts',settings:'Settings'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=x=>Number(x||0).toFixed(2);
async function api(path,opt={}){const r=await fetch('/api/'+path,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function form(data){return {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)}}
function toast(title,msg,ok=true){const t=$('#toast');t.innerHTML=`<b>${esc(title)}</b><div class="${ok?'ok':''}">${esc(msg)}</div>`;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function openModal(html){$('#dialog').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function switchView(v){state.view=v;$$('.view').forEach(x=>x.classList.remove('active'));$('#view-'+v).classList.add('active');$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#pageTitle').textContent=titles[v];render(v)}
$$('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function statusP(s){let c=s==='ACTIVE'||s==='LOW'?'good':s==='HIGH'?'bad':'warn';return `<span class="pill ${c}">● ${esc(s)}</span>`}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
async function render(v){
try{
if(v==='overview')return overview();if(v==='students')return students();if(v==='classes')return classes();if(v==='subjects')return subjects();if(v==='attendance')return attendance();if(v==='marks')return marks();if(v==='search')return search();
if(v==='analytics')return analytics();if(v==='risk')return risk();if(v==='alerts')return alerts();if(v==='database')return database();if(v==='events')return events();if(v==='audit')return audit();if(v==='runtime')return runtime();if(v==='health')return health();
if(v==='codespace')return codespace();if(v==='ai')return ai();if(v==='files')return files();if(v==='settings')return settings();if(v==='profile')return profile(state.selected);
}catch(e){$('#view-'+v).innerHTML=`<div class="card bad"><b>Unable to load</b><p class="muted">${esc(e.message)}</p></div>`}}
async function overview(){const d=await api('overview');$('#view-overview').innerHTML=`<div class="title"><h1>Academic System</h1><p>Student Management & Academic Intelligence Environment</p></div>
<div class="grid g4"><div class="card metric accent"><small>ACTIVE STUDENTS</small><strong>${d.students}</strong></div><div class="card metric warn"><small>ATTENDANCE RISKS</small><strong>${d.attendanceRisks}</strong></div><div class="card metric bad"><small>ACADEMIC RISKS</small><strong>${d.academicRisks}</strong></div><div class="card metric good"><small>JAVA COMPONENTS</small><strong>${d.components}</strong></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><div class="sectionhead"><h3>Recent Activity</h3><button class="btn" onclick="switchView('events')">Open stream</button></div><div class="list">${(d.recent||[]).map(e=>`<div class="row"><span>${esc(e.type)}</span><span class="muted mono">${esc(e.timestamp||e.time||'')}</span></div>`).join('')||'<div class=empty>No events yet</div>'}</div></div>
<div class="card"><div class="sectionhead"><h3>Quick Actions</h3></div><div class="grid g2"><button class="btn primary" onclick="addStudent()">+ Add Student</button><button class="btn" onclick="switchView('attendance')">Record Attendance</button><button class="btn" onclick="switchView('marks')">Enter Marks</button><button class="btn" onclick="switchView('search')">Search Students</button></div></div></div>`}
async function students(q=''){const d=await api('students?q='+encodeURIComponent(q));state.students=d;$('#view-students').innerHTML=`<div class="sectionhead"><div class="title" style="margin:0"><h1>Students</h1><p>${d.length} records from the live database</p></div><button class="btn primary" onclick="addStudent()">+ Add Student</button></div><div class="card"><div class="toolbar"><input id="studentSearch" class="input grow" placeholder="Search by ID, name or department" value="${esc(q)}"><button class="btn" onclick="students($('#studentSearch').value)">Search</button></div><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Semester</th><th>Attendance</th><th>Status</th><th></th></tr></thead><tbody>${d.map(s=>`<tr><td class="mono">${esc(s.id)}</td><td><b>${esc(s.name)}</b><div class="muted">${esc(s.email)}</div></td><td>${esc(s.department)}</td><td>${s.semester}</td><td>${money(s.attendance)}%</td><td>${statusP(s.status)}</td><td><button class="btn" onclick="openProfile('${esc(s.id)}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}
async function openProfile(id){state.selected=id;switchView('profile')}
async function profile(id){const s=await api('students/'+encodeURIComponent(id));$('#view-profile').innerHTML=`<div class="sectionhead"><button class="btn" onclick="switchView('students')">← Students</button><div></div></div><div class="card profileHead"><div class="identity"><div class="bigavatar">${initials(s.name)}</div><div><h1 style="margin:0">${esc(s.name)} <span class="muted mono" style="font-size:13px">${esc(s.id)}</span></h1><p class="muted">${esc(s.department)} · Semester ${s.semester} ${statusP(s.status)}</p></div></div><div><button class="btn" onclick="editStudent('${esc(s.id)}')">Edit</button> <button class="btn danger" onclick="deleteStudent('${esc(s.id)}')">Delete</button></div></div>
<div class="grid g4" style="margin-top:16px"><div class="card metric"><small>GPA</small><strong>${money(s.gpa)}</strong></div><div class="card metric"><small>ATTENDANCE</small><strong>${money(s.attendance)}%</strong></div><div class="card metric"><small>RISK</small><strong>${statusP(s.risk)}</strong></div><div class="card metric"><small>TYPE</small><strong style="font-size:17px">${esc(s.type)}</strong></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><div class="sectionhead"><h3>Personal Details</h3></div><div class="list"><div class="row"><span class="muted">Email</span><b>${esc(s.email)}</b></div><div class="row"><span class="muted">Phone</span><b>${esc(s.phone)}</b></div><div class="row"><span class="muted">Admission</span><b>${esc(s.admission_date)}</b></div></div></div>
<div class="card"><div class="sectionhead"><h3>Academic Records</h3><button class="btn primary" onclick="markModal('${esc(s.id)}')">Update Mark</button></div><table class="table"><thead><tr><th>Subject</th><th>Mark</th><th>Grade</th></tr></thead><tbody>${(s.marks||[]).map(m=>`<tr><td>${esc(m.name||m.subject_code)}</td><td>${money(m.mark)}</td><td>${grade(m.mark)}</td></tr>`).join('')||'<tr><td colspan=3 class=empty>No marks</td></tr>'}</tbody></table></div></div>
<div class="card" style="margin-top:16px"><div class="sectionhead"><h3>Live Activity</h3><button class="btn" onclick="attendanceModal('${esc(s.id)}')">Record Attendance</button></div><div class="list">${(s.events||[]).map(e=>`<div class="row"><span>${esc(e.type)}</span><span class="muted mono">${esc(e.timestamp)}</span></div>`).join('')||'<div class=empty>No events for this student</div>'}</div></div>`}
function grade(m){m=Number(m);return m>=90?'O':m>=80?'A+':m>=70?'A':m>=60?'B+':m>=50?'B':m>=40?'C':'F'}
function addStudent(){openModal(`<div class="sectionhead"><h3>Add Student</h3><button class="btn" onclick="closeModal()">×</button></div><form id="studentForm"><div class="formgrid">${field('id','Student ID','24CE1040')} ${field('name','Full name','New Student')} ${field('email','Email','student@example.edu')} ${field('phone','Phone','+91')} ${field('department','Department','Computer Engineering')} ${field('semester','Semester','5','number')} ${field('type','Type','UNDERGRADUATE')} ${field('status','Status','ACTIVE')}</div><div style="margin-top:15px;text-align:right"><button class="btn primary">Create Student</button></div></form>`);$('#studentForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{await api('students',form(f));closeModal();toast('Student created','The record is now in the live database.');switchView('students')}catch(x){toast('Create failed',x.message,false)}}}
function editStudent(id){api('students/'+encodeURIComponent(id)).then(s=>{openModal(`<div class="sectionhead"><h3>Edit Student</h3><button class="btn" onclick="closeModal()">×</button></div><form id="editForm"><div class="formgrid">${field('name','Full name',s.name)} ${field('email','Email',s.email)} ${field('phone','Phone',s.phone)} ${field('department','Department',s.department)} ${field('semester','Semester',s.semester,'number')} ${field('status','Status',s.status)}</div><div style="margin-top:15px;text-align:right"><button class="btn primary">Save Changes</button></div></form>`);$('#editForm').onsubmit=async e=>{e.preventDefault();try{await api('students/'+encodeURIComponent(id),form(Object.fromEntries(new FormData(e.target))));closeModal();toast('Student updated','Database and UI synchronized.');profile(id)}catch(x){toast('Update failed',x.message,false)}}})}
async function deleteStudent(id){if(!confirm('Delete this student and related records?'))return;try{await api('students/'+encodeURIComponent(id),{method:'DELETE'});toast('Student deleted','The live database was updated.');switchView('students')}catch(e){toast('Delete failed',e.message,false)}}
function field(n,l,v='',type='text'){return `<div><label>${l}</label><input class="input" style="width:100%" name="${n}" type="${type}" value="${esc(v)}" required></div>`}
async function classes(){const d=await api('classes');$('#view-classes').innerHTML=`<div class="sectionhead"><div class="title" style="margin:0"><h1>Classes</h1><p>Live class and section registry</p></div><button class="btn primary" onclick="addClass()">+ Add Class</button></div><div class="card"><table class="table"><thead><tr><th>Class</th><th>Department</th><th>Semester</th><th>Room</th><th>Capacity</th></tr></thead><tbody>${d.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.department)}</td><td>${x.semester}</td><td>${esc(x.room)}</td><td>${x.capacity}</td></tr>`).join('')}</tbody></table></div>`}
function addClass(){openModal(`<div class="sectionhead"><h3>Add Class</h3><button class="btn" onclick="closeModal()">×</button></div><form id="classForm"><div class="formgrid">${field('name','Class name','CE-5C')}${field('department','Department','Computer Engineering')}${field('semester','Semester','5','number')}${field('room','Room','B-206')}${field('capacity','Capacity','60','number')}</div><div style="margin-top:15px;text-align:right"><button class="btn primary">Create Class</button></div></form>`);$('#classForm').onsubmit=async e=>{e.preventDefault();try{await api('classes',form(Object.fromEntries(new FormData(e.target))));closeModal();toast('Class created','Class registry updated.');classes()}catch(x){toast('Create failed',x.message,false)}}}
async function subjects(){const d=await api('subjects');$('#view-subjects').innerHTML=`<div class="sectionhead"><div class="title" style="margin:0"><h1>Subjects</h1><p>Academic subject catalogue</p></div><button class="btn primary" onclick="addSubject()">+ Add Subject</button></div><div class="grid g3">${d.map(x=>`<div class="card"><b>${esc(x.code)}</b><h3>${esc(x.name)}</h3><span class="muted">${x.credits} credits</span></div>`).join('')}</div>`}
function addSubject(){openModal(`<div class="sectionhead"><h3>Add Subject</h3><button class="btn" onclick="closeModal()">×</button></div><form id="subjectForm"><div class="formgrid">${field('code','Code','CS301')}${field('name','Name','Distributed Systems')}${field('credits','Credits','3','number')}</div><div style="margin-top:15px;text-align:right"><button class="btn primary">Create Subject</button></div></form>`);$('#subjectForm').onsubmit=async e=>{e.preventDefault();try{await api('subjects',form(Object.fromEntries(new FormData(e.target))));closeModal();toast('Subject created','Subject catalogue updated.');subjects()}catch(x){toast('Create failed',x.message,false)}}}
async function attendance(){const d=await api('students');$('#view-attendance').innerHTML=`<div class="title"><h1>Attendance</h1><p>Record attendance against the live student database.</p></div><div class="card"><table class="table"><thead><tr><th>Student</th><th>Attendance</th><th>Risk</th><th>Action</th></tr></thead><tbody>${d.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="muted mono">${esc(s.id)}</div></td><td>${money(s.attendance)}%<div class="bar"><i style="width:${Math.min(100,Number(s.attendance))}%"></i></div></td><td>${statusP(Number(s.attendance)<75?'HIGH':'LOW')}</td><td><button class="btn" onclick="attendanceModal('${esc(s.id)}')">Record</button></td></tr>`).join('')}</tbody></table></div>`}
function attendanceModal(id){api('subjects').then(subs=>{openModal(`<div class="sectionhead"><h3>Record Attendance</h3><button class="btn" onclick="closeModal()">×</button></div><form id="attForm"><div class="formgrid"><div><label>Subject</label><select class="input" style="width:100%" name="subject">${subs.map(s=>`<option value="${esc(s.code)}">${esc(s.code)} — ${esc(s.name)}</option>`).join('')}</select></div><div><label>Presence</label><select class="input" style="width:100%" name="present"><option value="true">Present</option><option value="false">Absent</option></select></div></div><div style="margin-top:15px;text-align:right"><button class="btn primary">Record Attendance</button></div></form>`);$('#attForm').onsubmit=async e=>{e.preventDefault();try{await api('students/'+encodeURIComponent(id)+'/attendance',form(Object.fromEntries(new FormData(e.target))));closeModal();toast('Attendance recorded','Attendance, risk analysis and events were updated.');state.selected=id;profile(id)}catch(x){toast('Attendance failed',x.message,false)}}})}
async function marks(){const d=await api('students');$('#view-marks').innerHTML=`<div class="title"><h1>Marks & GPA</h1><p>Update marks and let the runtime recalculate academic intelligence.</p></div><div class="grid g3">${d.map(s=>`<div class="card"><div class="sectionhead"><b>${esc(s.name)}</b><span class="muted mono">${esc(s.id)}</span></div><div class="statline"><div><span class="muted">GPA</span><b>${money(s.gpa||0)}</b></div><div><span class="muted">Risk</span><b>${statusP(s.status==='ACTIVE'?'LOW':'MEDIUM')}</b></div></div><button class="btn primary" style="margin-top:14px;width:100%" onclick="markModal('${esc(s.id)}')">Update Mark</button></div>`).join('')}</div>`}
function markModal(id){api('subjects').then(subs=>{openModal(`<div class="sectionhead"><h3>Update Mark</h3><button class="btn" onclick="closeModal()">×</button></div><form id="markForm"><div class="formgrid"><div><label>Subject</label><select class="input" style="width:100%" name="subject">${subs.map(s=>`<option value="${esc(s.code)}">${esc(s.code)} — ${esc(s.name)}</option>`).join('')}</select></div>${field('mark','Mark (0–100)','80','number')}</div><div style="margin-top:15px;text-align:right"><button class="btn primary">Save Mark</button></div></form>`);$('#markForm').onsubmit=async e=>{e.preventDefault();try{await api('students/'+encodeURIComponent(id)+'/marks',form(Object.fromEntries(new FormData(e.target))));closeModal();toast('Mark updated','GPA, risk and event stream have been refreshed.');state.selected=id;profile(id)}catch(x){toast('Mark update failed',x.message,false)}}})}
async function search(){const d=await api('students');$('#view-search').innerHTML=`<div class="title"><h1>Search</h1><p>Multi-field live search over the student domain.</p></div><div class="card"><div class="toolbar"><input id="searchBox" class="input grow" placeholder="Name, ID or department"><button class="btn primary" onclick="runSearch()">Search</button></div><div id="searchResults" class="empty">Enter a query to search.</div></div>`}
async function runSearch(){const q=$('#searchBox').value;const d=await api('students?q='+encodeURIComponent(q));$('#searchResults').innerHTML=d.length?`<table class="table"><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Status</th></tr></thead><tbody>${d.map(s=>`<tr><td class=mono>${esc(s.id)}</td><td><button class="btn" onclick="openProfile('${esc(s.id)}')">${esc(s.name)}</button></td><td>${esc(s.department)}</td><td>${statusP(s.status)}</td></tr>`).join('')}</tbody></table>`:'No matching students.'}
async function analytics(){const d=await api('analytics');$('#view-analytics').innerHTML=`<div class="title"><h1>Analytics</h1><p>Computed directly from live academic records.</p></div><div class="grid g3"><div class="card metric accent"><small>AVERAGE GPA</small><strong>${money(d.averageGpa)}</strong></div><div class="card metric good"><small>AVERAGE ATTENDANCE</small><strong>${money(d.averageAttendance)}%</strong></div><div class="card"><small class="muted">MARK DISTRIBUTION</small><div class="list" style="margin-top:10px">${Object.entries(d.gradeBands).map(([k,v])=>`<div><div class="row"><span>${esc(k)}</span><b>${v}</b></div></div>`).join('')}</div></div></div><div class="card" style="margin-top:16px"><div class="sectionhead"><h3>Department Overview</h3></div><table class="table"><thead><tr><th>Department</th><th>Students</th><th>Average Attendance</th></tr></thead><tbody>${d.departments.map(x=>`<tr><td>${esc(x.department)}</td><td>${x.count}</td><td>${money(x.attendance)}%</td></tr>`).join('')}</tbody></table></div>`}
async function risk(){const d=await api('risk');$('#view-risk').innerHTML=`<div class="title"><h1>Risk Analysis</h1><p>Rule-driven academic and attendance risk from the live domain.</p></div><div class="grid g3">${d.length?d.map(s=>`<div class="card ${s.risk==='HIGH'?'bad':'warn'}"><div class="sectionhead"><b>${esc(s.name)}</b>${statusP(s.risk)}</div><div class="muted mono">${esc(s.id)}</div><div style="margin-top:14px">GPA <b>${money(s.gpa)}</b></div><div>Attendance <b>${money(s.attendance)}%</b></div><button class="btn" style="margin-top:12px" onclick="openProfile('${esc(s.id)}')">Inspect student</button></div>`).join(''):'<div class="card"><div class="empty">No students currently above risk thresholds.</div></div>'}</div>`}
async function alerts(){const d=await api('alerts');$('#view-alerts').innerHTML=`<div class="title"><h1>Alerts</h1><p>Warnings and domain events requiring attention.</p></div><div class="card"><div class="list">${d.map(e=>`<div class="row"><span>${esc(e.type)} ${e.student_id?`· ${esc(e.student_id)}`:''}</span><span class="muted">${esc(e.timestamp)}</span></div>`).join('')||'<div class=empty>No alerts</div>'}</div></div>`}
async function database(){const d=await api('database');$('#view-database').innerHTML=`<div class="title"><h1>Live Database</h1><p>${esc(d.engine)} · ${esc(d.mode)} · ${esc(d.path)}</p></div><div class="grid g4"><div class="card metric"><small>STUDENTS</small><strong>${d.students.length}</strong></div><div class="card metric"><small>SUBJECTS</small><strong>${d.subjects.length}</strong></div><div class="card metric"><small>CLASSES</small><strong>${d.classes.length}</strong></div><div class="card metric"><small>MARKS</small><strong>${d.marks.length}</strong></div></div><div class="card" style="margin-top:16px"><div class="sectionhead"><h3>Tables</h3><span class="muted">${d.tables.join(' · ')}</span></div><table class="table"><thead><tr><th>Student ID</th><th>Name</th><th>Department</th><th>Attendance</th><th>Status</th></tr></thead><tbody>${d.students.map(s=>`<tr><td class=mono>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.department)}</td><td>${money(s.attendance)}%</td><td>${statusP(s.status)}</td></tr>`).join('')}</tbody></table></div>`}
async function events(){const d=await api('event-log');$('#view-events').innerHTML=`<div class="title"><h1>Event Stream</h1><p>Live event bus telemetry. New events arrive without refreshing.</p></div><div id="eventConsole" class="trace">${d.length ? d.map(eventLine).join('') : '<div class="empty">Waiting for system events...<br><br><small class="muted">Try updating a student mark or attendance to trigger an event.</small></div>'}</div>`}
function eventLine(e){return `<div><span class="muted">[${esc(e.timestamp||e.time||'')}]</span> <b>${esc(e.type)}</b> ${e.student_id?`<span class="muted">${esc(e.student_id)}</span>`:''}</div>`}
async function audit(){const d=await api('audit');$('#view-audit').innerHTML=`<div class="title"><h1>Audit Log</h1><p>Persistent record of administrative actions.</p></div><div class="card"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>${d.map(x=>`<tr><td class=mono>${esc(x.timestamp)}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td>${esc(x.details)}</td></tr>`).join('')||'<tr><td colspan=4 class=empty>No audit records</td></tr>'}</tbody></table></div>`}
async function runtime(){const d=await api('runtime');$('#view-runtime').innerHTML=`<div class="title"><h1>Runtime</h1><p>The machinery underneath the application.</p></div><div class="grid g2">${[['Runtime',d.runtime],['Web Gateway',d.webGateway],['Event Bus',d.eventBus],['Database',d.database],['Filesystem Watcher',d.filesystemWatcher],['Scheduler',d.scheduler]].map(x=>`<div class="card"><div class="sectionhead"><b>${x[0]}</b><span class="pill good">● ${x[1]}</span></div></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="row"><span>Java</span><b>${esc(d.java)}</b></div><div class="row"><span>Source components</span><b>${d.components}</b></div><div class="row"><span>Workspace</span><b class="mono">${esc(d.workspace)}</b></div></div>`}
async function health(){const d=await api('health');$('#view-health').innerHTML=`<div class="title"><h1>System Health</h1><p>Connectivity checks across the unified application.</p></div><div class="grid g2">${Object.entries(d).map(([k,v])=>`<div class="card"><div class="sectionhead"><b>${esc(k)}</b><span class="pill ${v===true||v==='HEALTHY'?'good':'warn'}">● ${esc(v)}</span></div></div>`).join('')}</div>`}
async function codespace(){const d=await api('files');state.files=d;$('#view-codespace').innerHTML=`<div class="title"><h1>Live Codespace</h1><p>Read-only live replica of the Java source currently on disk.</p></div><div class="code-layout"><div class="tree" id="codeTree">${tree(d,'')}</div><div class="code" id="codePanel"><div class="empty">Select a Java file.</div></div></div>`}
function tree(items, currentPath){return items.map(x=>x.directory?`<div style="margin:7px 0"><button onclick="toggleDir(this, '${encodeURIComponent(x.path)}')">📂 ${esc(x.name)}</button><div style="margin-left:15px;display:none;"></div></div>`:`<button onclick="openCode('${encodeURIComponent(x.path)}')">📄 ${esc(x.name)}</button>`).join('')}
async function toggleDir(btn, path){const div=btn.nextElementSibling;if(div.style.display==='none'){if(!div.innerHTML){const d=await api('files?path='+path);div.innerHTML=tree(d, path);}div.style.display='block';}else{div.style.display='none';}}
async function openCode(path){const d=await api('file?path='+path);$('#codePanel').innerHTML=`<div class="row"><b>${esc(d.path)}</b><span class="muted">${esc(d.modified)}</span></div><pre>${esc(d.content)}</pre>`}
async function ai(){const d=await api('ai');$('#view-ai').innerHTML=`<div class="title"><h1>AI Development</h1><p>Controlled development loop for the live codespace. The system observes first and never silently overwrites source.</p></div><div class="grid g4">${[['Observe',d.observe],['Propose',d.propose],['Test',d.test],['Apply',d.apply]].map(x=>`<div class="card"><small class="muted">${x[0].toUpperCase()}</small><h3>${esc(x[1])}</h3></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="sectionhead"><h3>Development Pipeline</h3><button class="btn primary" onclick="build()">Run real Java build</button></div><div class="row"><span>1 · Observe local source</span><span class="pill good">READY</span></div><div class="row"><span>2 · Propose a bounded change</span><span class="pill good">READY</span></div><div class="row"><span>3 · Compile and validate</span><span class="pill good">READY</span></div><div class="row"><span>4 · Apply to live codespace</span><span class="pill warn">APPROVAL REQUIRED</span></div><p class="muted">This keeps autonomous development auditable instead of allowing an uncontrolled agent to mutate the running application.</p></div>`}
async function build(){toast('Build started','Compiling the actual Java source tree...');const d=await api('build',{method:'POST'});toast(d.success?'Build successful':'Build failed',d.success?`${d.files} source files compiled.`:d.output||d.error,d.success)}
async function files(){const d=await api('artifacts');$('#view-files').innerHTML=`<div class="title"><h1>Files & Artifacts</h1><p>Operational artifacts around the live application.</p></div><div class="grid g3"><div class="card"><h3>Source</h3><p class="muted">Live Codespace reads directly from the local source directory.</p><button class="btn" onclick="switchView('codespace')">Open Codespace</button></div><div class="card"><h3>Database</h3><p class="muted">${d.data?'Persistent data directory exists.':'No data directory yet.'}</p><button class="btn" onclick="switchView('database')">Open Database</button></div><div class="card"><h3>Backups / Exports</h3><p class="muted">Backup: ${d.backups?'available':'not created'} · Export: ${d.exports?'available':'not created'}</p><button class="btn" onclick="build()">Validate Project</button></div></div>`}
function settings(){$('#view-settings').innerHTML=`<div class="title"><h1>Settings</h1><p>Runtime preferences for this local environment.</p></div><div class="card"><div class="row"><span>Role</span><b>Admin</b></div><div class="row"><span>Backend</span><b>Java HttpServer · same origin</b></div><div class="row"><span>Database</span><b>Embedded persistent HSQLDB</b></div><div class="row"><span>Live events</span><b class="pill good">● SSE connected</b></div><div class="row"><span>Source mutations</span><b class="pill warn">Approval required</b></div></div>`}
function fieldValue(){return ''}
function connectEvents(){const es=new EventSource('/api/events');es.onmessage=e=>{try{const d=JSON.parse(e.data);if(state.view==='events'){const c=$('#eventConsole');if(c){c.insertAdjacentHTML('afterbegin',eventLine(d));}}if(state.view==='overview'||state.view==='students')render(state.view)}catch{}};es.onerror=()=>{}}
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString(),1000);
connectEvents();render('overview');
</script>
</body></html>
